    <script>
        let url = new URLSearchParams(document.location.search).get("url")
        var win = window.open('about:blank',target="_top")// <-- include the URL 
        var doc = '<form action="https://cdn.proxyium.com/proxyrequest.php" method="post" target="_top"><input type="hidden" name="type" value=""><input type="hidden" name="proxy_country" value="pl"><input type="hidden" name="url" value="'+url+'" id="url"><input type="submit" value="Klick hier" id="btn"></form>'
        win.document.body.innerHTML=doc
        win.document.getElementById("btn").click()
    </script>
</body>
