<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        let url = new URLSearchParams(document.location.search).get("url")
        if(!URL.canParse(url)){
            if(URL.canParse("https://"+url)){
               url = "https://" + url 
            } else {
                location = "https://azureserv.com/?__cpo="+btoa(url)
            }
        }
        params = new URL(url).searchParams
        params.append("__cpo",btoa(new URL(url).origin).replace(/[=]/g, ''))
        location = "https://azureserv.com"+new URL(url).pathname+"?"+params.toString()
    </script>
</body>
</html>
