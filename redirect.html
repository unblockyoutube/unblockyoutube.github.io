<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="margin: 0;">
    
    <iframe srcdoc='
    <form action="https://cdn.proxyium.com/proxyrequest.php" method="post" target="_top">
        <input type="hidden" name="type" value="">
        <input type="hidden" name="proxy_country" value="pl">
        <input type="hidden" name="url" value="" id="url">
        <input type="submit" value="Klick hier" id="btn">
    </form>
    ' style="position:fixed;top:0;left:0;bottom:0;right:0;width:100%;height:100%;border:none;margin:0;padding:0;overflow:hidden;" id="frame"></iframe>
    <script>
        var win = window.open('about:blank',target="_blank")// <-- include the URL 
        var url = document.getElementById("frame").srcdoc
        var iframe = win.document.createElement('iframe')
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "none";
        iframe.srcdoc = url
        win.document.body.appendChild(iframe)
        document.getElementById("frame").onload = function(){
            document.getElementById("frame").contentDocument.getElementById("url").value = new URLSearchParams(document.location.search).get("url")
            if(!new URLSearchParams(document.location.search).get("stop")){
                document.getElementById("frame").contentDocument.getElementById("btn").click()
            }
        }   
    </script>
</body>
</html>
