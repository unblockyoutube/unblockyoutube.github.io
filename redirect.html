<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <form method="post" action="https://cdn.proxyium.com/proxyrequest.php">
        <input type="hidden" name="type" value>
        <input type="hidden" name="proxy_country" value="pl">
        <input type="hidden" name="url" id="url" value="">
        <button type="submit" id="btn">Klicke Hier</button>
    </form>
    <script>
        document.getElementById("url").value = new URLSearchParams(location.search).get("url")
        document.getElementById("btn").click()
    </script>
</body>
</html>
