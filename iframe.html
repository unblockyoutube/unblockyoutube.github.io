<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website embed</title>
</head>
<body style="margin: 0;">
    <iframe src="" frameborder="0" webkitallowfullscreen="1" mozallowfullscreen="1" allowfullscreen="1" style="position:fixed;top:0;left:0;bottom:0;right:0;width:100%;height:100%;border:none;margin:0;padding:0;overflow:hidden;" id="frame"></iframe>
    <script>
        document.getElementById("frame").src = new URLSearchParams(document.location.search).get("url");
        document.getElementById("frame").requestFullscreen();
    </script>
</body>
</html>
